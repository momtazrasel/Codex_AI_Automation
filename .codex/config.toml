[mcp_servers.playwright-test]
command = "node"
args = ["node_modules/playwright/cli.js", "run-test-mcp-server"]
cwd = "D:/Automation/Codex_AI_Automation"
enabled = true
required = true
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = [
  "browser_click",
  "browser_close",
  "browser_console_messages",
  "browser_drag",
  "browser_evaluate",
  "browser_file_upload",
  "browser_handle_dialog",
  "browser_hover",
  "browser_navigate",
  "browser_navigate_back",
  "browser_network_request",
  "browser_network_requests",
  "browser_press_key",
  "browser_run_code_unsafe",
  "browser_select_option",
  "browser_snapshot",
  "browser_take_screenshot",
  "browser_type",
  "browser_wait_for",
  "planner_setup_page",
  "planner_save_plan",
]
